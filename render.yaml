services:
  - type: web
    name: jru-alumni-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Injected automatically from the database below.
      - key: DATABASE_URL
        fromDatabase:
          name: jru-alumni-db
          property: connectionString
      # Render PostgreSQL requires TLS. Set to false only for a local database.
      - key: DB_SSL
        value: "true"
      # Admin portal passcode (Alt+A opens the admin sign-in modal).
      - key: ADMIN_PIN
        value: "1234"
      # Render generates this once and keeps it stable across deploys.
      - key: ADMIN_TOKEN_SECRET
        generateValue: true

databases:
  - name: jru-alumni-db
    databaseName: jru_alumni_db
    user: jru_alumni
    plan: free
